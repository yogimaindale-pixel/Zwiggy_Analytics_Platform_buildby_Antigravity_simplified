[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zwiggy-dwh"
version = "1.0.0"
description = "Zwiggy Analytics Platform - Medallion Data Warehouse (Bronze, Silver, Gold)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=0.9.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
zwiggy-dwh = "zwiggy_dwh.cli:main"
